function targetFrame(item, mech) { if (!item) return {aligned:false, elements:elements, xyz:null, disp:null, broken:[], formed:[], core:[], label:"missing"}; const nativeEls = item.elements || elements; const nativeXYZ = item.xyz || null; const nativeDisp = item.picked_disp || null; if (!nativeXYZ) return {aligned:false, elements:nativeEls, xyz:item.xyz_in_R || null, disp:item.picked_disp_R || null, broken:item.broken_bonds_T || mech.broken_bonds_R || [], formed:item.formed_bonds_T || mech.formed_bonds_R || [], core:item.core_atoms_T || mech.core_atoms || [], label:"native"}; if (!rOrdered) return {aligned:false, elements:nativeEls, xyz:nativeXYZ, disp:nativeDisp, broken:item.broken_bonds_T || mech.broken_bonds_R || [], formed:item.formed_bonds_T || mech.formed_bonds_R || [], core:item.core_atoms_T || mech.core_atoms || [], label:"native"}; const n = nativeXYZ.length; const perm = Array(n).fill(null); const used = new Set(); const cmap = item.core_map || {}; for (const rk of Object.keys(cmap)) { const r = parseInt(rk), t = parseInt(cmap[rk]); if (Number.isInteger(r) && Number.isInteger(t) && r >= 0 && r < n && t >= 0 && t < n && !used.has(t)) { perm[r] = t; used.add(t); } } for (let r = 0; r < n; r++) { if (perm[r] !== null) continue; const want = elements[r]; let pick = -1; for (let t = 0; t < n; t++) { if (!used.has(t) && nativeEls[t] === want) { pick = t; break; } } if (pick < 0) for (let t = 0; t < n; t++) { if (!used.has(t)) { pick = t; break; } } if (pick >= 0) { perm[r] = pick; used.add(pick); } } const orderedXYZ = perm.map(t => nativeXYZ[t]); const orderedDisp = nativeDisp ? perm.map(t => nativeDisp[t]) : null; return {aligned:true, elements:elements, xyz:orderedXYZ, disp:orderedDisp, broken:mech.broken_bonds_R || [], formed:mech.formed_bonds_R || [], core:mech.core_atoms || [], label:"R-ordered"}; }

function viewerHtmlForArchive() { return "<!doctype html>\n" + document.documentElement.outerHTML; }
async function downloadAll() { if (typeof JSZip === "undefined") { alert("Download library is not loaded"); return; } const root = safeName(DATA.step); const zip = new JSZip(); zip.file(root+"/R.xyz", xyzText(DATA.reactant.elements, DATA.reactant.coords, DATA.step+" R")); zip.file(root+"/P.xyz", xyzText(DATA.product.elements, DATA.product.coords, DATA.step+" P")); const firstGTMech = (DATA.mechanisms || []).find(m => m.gt && (m.gt.xyz || m.gt.xyz_in_R)); if (firstGTMech) { const frame = targetFrame(firstGTMech.gt, firstGTMech); zip.file(root+"/GT/GT"+targetSuffix()+".xyz", xyzText(frame.elements, frame.xyz, DATA.step+" GT "+frame.label)); } const seenIG = new Set(); for (const mech of DATA.mechanisms || []) { for (const ig of mech.igs || []) { if (seenIG.has(ig.label)) continue; const frame = targetFrame(ig, mech); if (!frame.xyz) continue; seenIG.add(ig.label); zip.file(root+"/IG/"+safeName(ig.label)+targetSuffix()+".xyz", xyzText(frame.elements, frame.xyz, DATA.step+" "+ig.label+" "+frame.label)); } } const manifest = buildArchiveManifest(); zip.file(root+"/mechanism.json", JSON.stringify(manifest, null, 2)); zip.file(root+"/energies_frequencies.json", JSON.stringify(buildEnergyFrequencySummary(), null, 2)); for (const mech of DATA.mechanisms || []) { zip.file(root+"/mechanisms/mechanism_"+String(mech.id).padStart(3,"0")+".json", JSON.stringify(mechanismRecord(mech), null, 2)); } zip.file(root+"/viewer_data.json", JSON.stringify(DATA, null, 2)); zip.file(root+"/view.html", viewerHtmlForArchive()); const blob = await zip.generateAsync({type:"blob"}); downloadBlob(root+".zip", blob); }
const animTimers = {};

function stopInterpolation() { if (interpPlayTimer) { clearInterval(interpPlayTimer); interpPlayTimer=null; } document.getElementById('interpPlayBtn').textContent='Play'; }
function renderInterpolationFrame() { const mech=findMech(currentMechId); const path=mech && mech.endpoint_interpolation; document.getElementById("interp-panel").hidden=!(path && path.frames && path.frames.length); const div=document.getElementById('vw_interp'); if (!path || !path.frames || !path.frames.length) { div.innerHTML=''; interpViewer=null; interpViewerMechId=null; document.getElementById('interp_meta').textContent='Interpolation unavailable'; return; } const slider=document.getElementById('interpFrame'); slider.max=String(path.frames.length-1); const index=Math.max(0,Math.min(path.frames.length-1,parseInt(slider.value)||0)); const frame=path.frames[index]; const sameViewer=!!(interpViewer && interpViewerMechId===mech.id); const savedView=(sameViewer && interpViewer.getView) ? interpViewer.getView() : null; if (!sameViewer) { div.innerHTML=''; interpViewer=$3Dmol.createViewer('vw_interp',{backgroundColor:'white'}); interpViewerMechId=mech.id; } else { interpViewer.removeAllModels(); interpViewer.removeAllShapes(); clearLabels(interpViewer); } const v=interpViewer; v.addModel(buildBody(DATA.reactant.elements,frame.coords),'xyz'); v.setStyle({},{stick:{radius:0.10},sphere:{scale:0.20}}); applyDegeneracyStyles(v,rDegMap(mech)); drawBonds(v,frame.coords,mech.broken_bonds_R,'red'); drawBonds(v,frame.coords,mech.formed_bonds_R,'green'); addAtomLabels(v,DATA.reactant.elements,frame.coords,reactantAtomLabels()); if (showClashHighlights) { const clashAtoms=new Set(); for (const pair of (frame.clashes.pairs||[])) for (const atom of pair.atoms) clashAtoms.add(atom); for (const atom of clashAtoms) v.setStyle({serial:atom},{stick:{radius:0.14,color:'#d000ff'},sphere:{scale:0.42,color:'#d000ff'}}); } if (savedView && v.setView) v.setView(savedView); else v.zoomTo(); v.render(); document.getElementById('interp_t').textContent='t='+frame.t.toFixed(2); document.getElementById('interp_method').textContent=path.method; const ratio=frame.clashes.minimum_radius_ratio; const pairs=(frame.clashes.pairs||[]).map(p=>'R'+p.atoms[0]+'–R'+p.atoms[1]).join(', '); const residuals=frame.constraint_residuals||{}; const geometry=' <b>persistent bond error</b>='+((100*(residuals.max_persistent_bond_relative_error||0)).toFixed(2))+'% <b>angle error</b>='+((residuals.max_angle_error_degrees||0).toFixed(2))+'° <b>torsion error</b>='+((residuals.max_torsion_error_degrees||0).toFixed(2))+'°'; document.getElementById('interp_meta').innerHTML='<span class="'+(frame.clashes.count?'clash-bad':'clash-ok')+'"><b>severe overlaps</b>='+frame.clashes.count+'</span> <b>min clearance</b>='+(ratio===null?'n/a':ratio.toFixed(3)+' × covalent radii')+geometry+(pairs?' <b>pairs</b>='+pairs:''); }
function toggleInterpolation() { if (interpPlayTimer) { stopInterpolation(); return; } document.getElementById('interpPlayBtn').textContent='Pause'; interpPlayTimer=setInterval(()=>{ const slider=document.getElementById('interpFrame'); let next=(parseInt(slider.value)||0)+1; if (next>parseInt(slider.max)) next=0; slider.value=String(next); renderInterpolationFrame(); },180); }
function render() { const mech = findMech(currentMechId); describeWitness(mech); document.getElementById('r_meta').innerHTML = structureMeta(DATA.reactant); document.getElementById('p_meta').innerHTML = structureMeta(DATA.product); document.querySelectorAll('.mech-sel button[data-id]').forEach(b => { b.classList.toggle('active', parseInt(b.dataset.id)===currentMechId); }); makeStatic('vw_R', DATA.reactant.elements, DATA.reactant.coords, mech.broken_bonds_R, [], rDegMap(mech), reactantAtomLabels()); const alignedP = mech.product_xyz_in_R_aligned || mech.product_xyz_in_R; const pAligned = !!(rOrdered && alignedP); const pEls = pAligned ? DATA.reactant.elements : DATA.product.elements; const pXYZ = pAligned ? alignedP : DATA.product.coords; const pFormed = pAligned ? mech.formed_bonds_R : (mech.formed_bonds_P || []); makeStatic('vw_P', pEls, pXYZ, [], pFormed, mappedProductDegMap(mech, pAligned), productAtomLabels(mech, pAligned)); document.getElementById('prod_label').innerHTML = (pAligned ? "R-ordered + spatially aligned" : "native P")+" (mech #"+mech.id+") <button class='dl' onclick='downloadP()'>XYZ</button>"; renderInterpolationFrame(); const gtFrame = mech.gt ? targetFrame(mech.gt, mech) : null; const showGT = !!(gtFrame && gtFrame.disp); document.getElementById('ref-row').classList.toggle('no-gt', !showGT); document.getElementById('gt_panel').style.display = showGT ? "" : "none"; if (showGT) { makeAnimated('vw_GT', gtFrame.elements, gtFrame.xyz, gtFrame.disp, gtFrame.broken, gtFrame.formed, gtFrame.core, targetDegMap(gtFrame, mech), targetAtomLabels(gtFrame)); document.getElementById('gt_S').innerHTML = "S = "+mech.gt.S.toFixed(3)+" <button class='dl' onclick='downloadGT()'>XYZ</button>"; document.getElementById('gt_meta').innerHTML = scoreMeta(mech.gt)+" <b>frame</b>="+gtFrame.label; } else { stopAnim('vw_GT'); document.getElementById('vw_GT').innerHTML = ""; } const grid = document.getElementById('grid'); grid.innerHTML = ""; const igs = [...mech.igs].sort((a,b) => (b.S||0) - (a.S||0)); igs.forEach((ig, idx) => { const frame = targetFrame(ig, mech); const div = document.createElement('div'); let cls = 'panel'; if (ig.is_top2) cls += ' top2'; if (ig.is_union_top && !ig.is_top2) cls += ' union'; div.className = cls; const sStr = ig.S !== undefined ? "S = "+ig.S.toFixed(3) : "no score"; const tag = ig.is_top2 ? '<span style="background:#d4af37;color:white;padding:1px 6px;border-radius:3px;font-size:11px;margin-left:4px">TOP2</span>' : (ig.is_union_top ? '<span style="background:#ff9;color:#660;padding:1px 6px;border-radius:3px;font-size:11px;margin-left:4px">union</span>' : ''); const dl = frame.xyz ? '<button class="dl">XYZ</button> ' : ''; div.innerHTML = '<div class="ph"><span class="lbl">'+ig.label+tag+'</span><span class="rk">'+dl+sStr+'</span></div><div class="vw"><div id="vw_ig'+idx+'" class="vwbox"></div></div><div class="meta">'+scoreMeta(ig)+" <b>frame</b>="+frame.label+"</div>"; grid.appendChild(div); const btn = div.querySelector('button.dl'); if (btn) btn.onclick = () => downloadIG(ig); if (frame.disp) makeAnimated("vw_ig"+idx, frame.elements, frame.xyz, frame.disp, frame.broken, frame.formed, frame.core, targetDegMap(frame, mech), targetAtomLabels(frame)); else if (frame.xyz) makeStatic("vw_ig"+idx, frame.elements, frame.xyz, frame.broken, frame.formed, targetDegMap(frame, mech), targetAtomLabels(frame)); }); }
const ms = document.getElementById('mech-sel'); ms.innerHTML = "<span style='font-size:13px;margin-right:8px;color:#444'>Mechanism:</span>"; document.getElementById('downloadAllBtn').onclick = downloadAll; document.getElementById('showAtomIndices').onchange = (e) => { showAtomIndices = !!e.target.checked; render(); }; document.getElementById('showDegeneracy').onchange = (e) => { showDegeneracy = !!e.target.checked; render(); }; document.getElementById('rOrdered').onchange = (e) => { rOrdered = !!e.target.checked; render(); }; DATA.mechanisms.forEach(m => { const b = document.createElement('button'); b.dataset.id = m.id; b.textContent = m.label + (m.gt ? "  GT S=" + m.gt.S.toFixed(3) : ""); if ((m.dedup_count||1) > 1) b.title = "Analytical branch encounters: "+m.dedup_count+"; source mechanisms: "+m.dedup_source_ids.join(", ")+"; cuts: "+m.dedup_cuts.join(", "); b.onclick = () => { currentMechId = m.id; render(); }; ms.appendChild(b); });
document.getElementById('interpFrame').oninput = renderInterpolationFrame;
document.getElementById('interpPlayBtn').onclick = toggleInterpolation;
document.getElementById('showClashHighlights').onchange = (e) => { showClashHighlights=!!e.target.checked; renderInterpolationFrame(); };
window.addEventListener('load', render);
window.addEventListener('resize',()=>Object.values(molecularViewers).forEach(v=>{v.resize();v.render()}));
</script>

   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="88.2" y="327.96" transform="rotate(-0 88.2 327.96)">Fork</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="234" y="327.96" transform="rotate(-0 234 327.96)">Exact state join</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3269a8" x="391.464" y="226.872" transform="rotate(-0 391.464 226.872)">04  Compile retained families</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(391.464 256.431062)">Merge equal or contained families.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(391.464 269.331062)">Keep incomparable alternatives.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(391.464 282.231063)">Preserve every discovering path.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24363c" x="20.16" y="350.64" transform="rotate(-0 20.16 350.64)">Schematic: joins require equal assignments, island partitions and deferred edges at a compatible continuation.</text>
   </g>

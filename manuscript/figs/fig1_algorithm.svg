   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24363c" x="16.92" y="16.92" transform="rotate(-0 16.92 16.92)">a  Continuous fragment growth</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f68" x="28.584" y="62.28" transform="rotate(-0 28.584 62.28)">01  Extend the frontier</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(28.584 91.839062)">Choose a strong source edge.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(28.584 104.739062)">Check all active fragment bonds.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(28.584 117.639062)">Carry compatible placements.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f68" x="252.144" y="62.28" transform="rotate(-0 252.144 62.28)">02  Preserve distinctions</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(252.144 92.672187)">Canonicalize candidate states.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(252.144 104.739062)">Keep locked roles and boundaries.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(252.144 117.639062)">Retain correlated symmetry.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f68" x="475.704" y="62.28" transform="rotate(-0 475.704 62.28)">03  Continue or branch</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(475.704 92.672187)">Grow until saturation.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(475.704 104.739062)">Fork distinct fragment placements.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #24363c" transform="translate(475.704 117.639062)">Continue under each prefix.</text>
   </g>

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxn_core"
version = "0.2.0"
description = "WBO-graph atom alignment + per-mode reactive scoring + ranked HTML viewer for transition-state initial guesses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["chemistry", "transition-state", "xtb", "wbo", "alignment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.23",
    "networkx>=2.8",
    "pynauty>=2.8",
    "sympy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest", "nbclient", "ipykernel"]
smiles = ["rdkit>=2022.9"]
sessions = ["pymongo>=4.6"]

[project.scripts]
rxn-core = "rxn_core.cli:main"

[project.urls]
Homepage = "https://github.com/yunhzou/coordinate_alignment"
Repository = "https://github.com/yunhzou/coordinate_alignment"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rxn_core = ["static/*.js", "static/LICENSES/*"]

# Note: xtb (Grimme) is a runtime requirement but not a Python dependency;
# install it via your system package manager (e.g. conda install -c conda-forge xtb).
